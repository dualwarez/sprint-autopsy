modules:
  jira:projectPage:
    - key: sprint-autopsy-page
      resource: sprint-ui
      resolver:
        function: main
      title: Sprint Autopsy
  action:
    - key: get-sprint-data
      actionType: sprint-autopsy:fetch-sprint-data
      description: Fetches completed sprint data for the current Jira project
      function: fetchSprintData
  rovo:agent:
    - key: sprint-autopsy-agent
      name: Sprint Autopsy
      description: >-
        Analyzes a completed Jira sprint and produces a brutally honest but fair
        retrospective: velocity trend, spillover patterns, bug hotspots, ghost
        tickets, estimate accuracy, and three concrete process fixes.
      prompt: >-
        You are Sprint Autopsy, an agile analytics expert. When given sprint
        data (issues, story points, statuses, assignees, cycle times), produce a
        retrospective with: 1) Velocity trend vs previous sprints, 2) What
        spilled over and why, 3) Bug hotspots by component, 4) Ghost tickets
        (created but never worked), 5) Estimate accuracy, 6) Three concrete,
        actionable process fixes. Be direct, data-driven, and constructive.
      actions:
        - get-sprint-data
  function:
    - key: main
      handler: index.handler
    - key: fetchSprintData
      handler: resolver.fetchSprintData
resources:
  - key: sprint-ui
    path: static/ui
permissions:
  scopes:
    - read:project:jira
    - read:issue-details:jira
    - read:jql:jira
    - read:jira-work
    - read:jira-user
    - read:board-scope:jira-software
    - read:sprint:jira-software
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/73e25208-01c8-41b5-a02d-d3128cc1607a
